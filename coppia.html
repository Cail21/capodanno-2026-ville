<!DOCTYPE html>
<html lang="it">
<head>

    :root {
      --bg: #111827;
      --panel: rgba(17, 24, 39, 0.94);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #f43f5e;
      --accent-gold: #f59e0b;
      --accent2: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      height: 100vh;
    }
    .topbar {
      position: relative;
      z-index: 10;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 8px 10px 8px;
      flex-shrink: 0;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(244, 63, 94, 0.20);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.48);
    }
    .top-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .icon-btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 800;
    }

    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: radial-gradient(circle at 50% 35%, #dbeafe 0%, #c7d9ec 55%, #9eb3cc 100%);
    }
    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      --poster-color: transparent;
    }
    .cam-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      gap: 5px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      max-width: calc(100vw - 16px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cam-bar::-webkit-scrollbar { display: none; }
    .cam-btn {
      background: transparent;
      color: #e2e8f0;
      border: none;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .cam-btn.active {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }

    .progress-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.70);
      color: #fff;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .progress-wrap.hide { opacity: 0; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hotspot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.90);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 3px 10px rgba(0,0,0,0.40);
      cursor: pointer;
      padding: 0;
    }
    .stage.hide-hotspots .hotspot { display: none !important; }

    .zone-strip {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 6;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-right: 92px;
    }
    .zone-strip::-webkit-scrollbar { display: none; }
    .zone-chip {
      flex: 0 0 auto;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.55);
      color: #fff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(0,0,0,0.28);

    .zone-chip.active {

      color: #fff;
      border-color: var(--accent);

    .ar-btn {

      right: 10px;
      z-index: 7;

      color: #fff;

      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;

    .bottom-card {

      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);

      flex-shrink: 0;
    }

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      color: #e2e8f0;
      line-height: 1.38;

    .info-foot {

      font-size: 10.5px;
      color: #94a3b8;

      color: #fff;

      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 9px;
      white-space: nowrap;

</head>

          { id: "h3", num: "3", pos: "-1.9m 1.0m -1.45m", orbit: "18deg 70deg 4.2m", label: "3. 🔥 Camera & Clima" }

    const mv = document.getElementById("mv");
    const loader = document.getElementById("loader");
    const tabsEl = document.getElementById("villaTabs");
    const zoneStrip = document.getElementById("zoneStrip");
    const stageEl = document.getElementById("stage");
    const btnLabels = document.getElementById("btnLabels");
    const btnRotate = document.getElementById("btnRotate");
    let currentSuite = SUITES[0];

    function resolveInitialIndex() {
      const p = new URLSearchParams(window.location.search).get("casa");
      if (!p) return 0;
      const num = parseInt(p, 10);
      if (!Number.isNaN(num) && num >= 1 && num <= SUITES.length) return num - 1;
      const found = SUITES.findIndex(v => v.id === p || v.id.includes(p.toLowerCase()));
      return found >= 0 ? found : 0;
    }

    function enterSuite(suite) {
      if (!suite || !suite.inside) return;
      mv.cameraTarget = suite.inside.target;
      mv.cameraOrbit = suite.inside.orbit;
      mv.fieldOfView = suite.inside.fov || "58deg";
    }

    function focusHotspot(hs, chipIdx) {
      mv.cameraTarget = hs.pos;
      mv.cameraOrbit = hs.orbit;
      mv.fieldOfView = "58deg";
      document.querySelectorAll(".zone-chip").forEach((c, i) => c.classList.toggle("active", i === chipIdx));
      document.querySelectorAll(".cam-btn").forEach(b => b.classList.remove("active"));
    }

    function renderHotspots(suite) {
      mv.querySelectorAll(".hotspot").forEach(el => el.remove());
      zoneStrip.innerHTML = "";
      suite.hotspots.forEach((hs, i) => {
        const pin = document.createElement("button");
        pin.className = "hotspot";
        pin.type = "button";
        pin.slot = "hotspot-" + hs.id;
        pin.dataset.position = hs.pos;
        pin.dataset.normal = "0 1 0";
        pin.textContent = hs.num;
        pin.addEventListener("click", () => focusHotspot(hs, i));
        mv.appendChild(pin);

        const chip = document.createElement("button");
        chip.className = "zone-chip";
        chip.type = "button";
        chip.textContent = hs.label;
        chip.addEventListener("click", () => focusHotspot(hs, i));
        zoneStrip.appendChild(chip);
      });
    }

    function selectSuite(idx, updateUrl = true) {
      const v = SUITES[idx];
      currentSuite = v;
      loader.classList.remove("hide");
      mv.cameraTarget = "auto";
      mv.cameraOrbit = "34deg 54deg 86%";
      mv.fieldOfView = "54deg";
      mv.src = v.glb;
      mv.alt = v.name;
      renderHotspots(v);

      document.querySelectorAll(".cam-btn").forEach((b, i) => b.classList.toggle("active", i === 0));
      document.getElementById("vName").textContent = v.name;
      document.getElementById("vLoc").textContent = v.loc;
      document.getElementById("vShare").textContent = v.share;
      document.getElementById("vTotal").textContent = v.total;
      document.getElementById("vDesc").textContent = v.desc;
      document.getElementById("vLink").href = v.url;

      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("active", i === idx);
        if (i === idx) t.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      });

      if (updateUrl && history.replaceState) {
        const u = new URL(window.location.href);
        u.searchParams.set("casa", v.id);
        history.replaceState(null, "", u.toString());
      }
    }

    SUITES.forEach((v, i) => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.textContent = v.short;
      btn.addEventListener("click", () => selectSuite(i));
      tabsEl.appendChild(btn);
    });

    mv.addEventListener("load", () => loader.classList.add("hide"));

    document.querySelectorAll(".cam-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cam-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".zone-chip").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        if (btn.dataset.mode === "inside") {
          enterSuite(currentSuite);
        } else {
          mv.cameraTarget = "auto";
          mv.cameraOrbit = btn.dataset.orbit;
          mv.fieldOfView = "54deg";
        }
      });
    });

    btnLabels.addEventListener("click", () => {
      const off = stageEl.classList.toggle("hide-hotspots");
      btnLabels.classList.toggle("active", !off);
    });

    btnRotate.addEventListener("click", () => {
      const active = btnRotate.classList.toggle("active");
      if (active) mv.setAttribute("auto-rotate", "");
      else mv.removeAttribute("auto-rotate");
    });

    selectSuite(resolveInitialIndex(), false);
  </script>
</body>
</html>
